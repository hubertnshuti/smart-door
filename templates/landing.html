<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Access Control</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c6af7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2'/%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'/%3E%3Ccircle cx='12' cy='16' r='1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Anti-FOUC: default light -->
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.setAttribute('data-theme','light');
    })();
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="login-page">
  <div class="login-bg"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme"
          style="position:fixed;top:1rem;right:1rem;z-index:200">
    <i data-lucide="sun"  id="icon-sun"></i>
    <i data-lucide="moon" id="icon-moon" style="display:none"></i>
  </button>

  <!-- Centered card -->
  <div style="position:relative;z-index:1;width:100%;max-width:460px;margin:1rem;text-align:center">

    <!-- Brand -->
    <div style="margin-bottom:2.5rem">
      <div style="width:64px;height:64px;background:var(--accent);border-radius:18px;
                  display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;
                  box-shadow:var(--accent-glow)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="width:30px;height:30px">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <circle cx="12" cy="16" r="1"/>
        </svg>
      </div>
      <div style="font-size:1.5rem;font-weight:800;color:var(--text-1);letter-spacing:-.03em">
        Lab Access Control
      </div>
      <div style="font-size:.88rem;color:var(--text-3);margin-top:.4rem">
        University of Rwanda — Computer Lab
      </div>
    </div>

    <!-- Portal chooser cards -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">

      <a href="{{ url_for('admin_login') }}"
         style="display:flex;flex-direction:column;align-items:center;gap:.9rem;
                padding:2rem 1.2rem;
                background:var(--bg-card);border:1px solid var(--border);
                border-radius:var(--radius);text-decoration:none;
                transition:border-color .2s,transform .2s,box-shadow .2s;
                backdrop-filter:blur(8px)"
         onmouseover="this.style.borderColor='var(--accent)';this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'"
         onmouseout="this.style.borderColor='';this.style.transform='';this.style.boxShadow=''">
        <div style="width:48px;height:48px;background:var(--accent-dim);border-radius:12px;
                    display:flex;align-items:center;justify-content:center">
          <i data-lucide="shield-check" style="width:22px;height:22px;color:var(--accent)"></i>
        </div>
        <div>
          <div style="font-size:.95rem;font-weight:700;color:var(--text-1);margin-bottom:.2rem">
            Admin
          </div>
          <div style="font-size:.75rem;color:var(--text-3)">
            Dashboard &amp; controls
          </div>
        </div>
      </a>

      <a href="{{ url_for('student_login') }}"
         style="display:flex;flex-direction:column;align-items:center;gap:.9rem;
                padding:2rem 1.2rem;
                background:var(--bg-card);border:1px solid var(--border);
                border-radius:var(--radius);text-decoration:none;
                transition:border-color .2s,transform .2s,box-shadow .2s;
                backdrop-filter:blur(8px)"
         onmouseover="this.style.borderColor='var(--green)';this.style.transform='translateY(-2px)';this.style.boxShadow='var(--shadow)'"
         onmouseout="this.style.borderColor='';this.style.transform='';this.style.boxShadow=''">
        <div style="width:48px;height:48px;background:var(--green-dim);border-radius:12px;
                    display:flex;align-items:center;justify-content:center">
          <i data-lucide="graduation-cap" style="width:22px;height:22px;color:var(--green)"></i>
        </div>
        <div>
          <div style="font-size:.95rem;font-weight:700;color:var(--text-1);margin-bottom:.2rem">
            Student
          </div>
          <div style="font-size:.75rem;color:var(--text-3)">
            Request lab access
          </div>
        </div>
      </a>

    </div>

  </div>
</div>

<script>
  function toggleTheme() {
    var html = document.documentElement;
    var isDark = html.getAttribute('data-theme') === 'dark';
    if (isDark) { html.setAttribute('data-theme','light'); localStorage.setItem('theme','light'); }
    else { html.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
    updateThemeIcon(); lucide.createIcons();
  }
  function updateThemeIcon() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('icon-sun').style.display  = isDark ? 'flex' : 'none';
    document.getElementById('icon-moon').style.display = isDark ? 'none' : 'flex';
  }
  document.addEventListener('DOMContentLoaded', function() { lucide.createIcons(); updateThemeIcon(); });
</script>
</body>
</html>
